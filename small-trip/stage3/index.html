<script>
const W=1792,H=1008,ODD=[[1673, 853, 48], [700, 742, 36], [520, 887, 47], [1667, 742, 41], [1093, 627, 52], [1207, 853, 51], [1033, 907, 46], [1445, 335, 34], [453, 747, 45], [147, 853, 39]],N=ODD.length;let found,lives,hints,s,tx,ty,over;
const v=document.getElementById('view'),w=document.getElementById('world');
function minS(){return Math.max(v.clientHeight/H,v.clientWidth/W)}
function clamp(){const m=minS();s=Math.min(Math.max(s,m),m*4);tx=Math.min(0,Math.max(v.clientWidth-W*s,tx));ty=Math.min(0,Math.max(v.clientHeight-H*s,ty));w.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
function hud(){cnt.textContent='찾은 물건 '+found.length+'/'+N;hp.textContent='\u2764'.repeat(lives)+'\u2661'.repeat(3-lives);hb.textContent='힌트 '+hints}
function ring(o,c){const m=document.createElement('div');m.className='mk '+(c||'');const r=o[2]+8;m.style.cssText+=`left:${o[0]-r}px;top:${o[1]-r}px;width:${2*r}px;height:${2*r}px`;w.appendChild(m);return m}
function reset(){found=[];lives=3;hints=2;over=false;document.querySelectorAll('.mk,.x').forEach(e=>e.remove());msg.style.display='none';s=minS();tx=0;ty=0;clamp();hud()}
function end(t){over=true;mt.textContent=t;msg.style.display='flex'}
function hint(){if(over||!hints)return;const r=ODD.map((o,i)=>i).filter(i=>!found.includes(i));if(!r.length)return;hints--;const m=ring(ODD[r[0]],'hint');setTimeout(()=>m.remove(),2200);hud()}
function tap(cx,cy){if(over)return;const x=(cx-tx)/s,y=(cy-ty)/s;let b=-1,bd=1e9;ODD.forEach((c,i)=>{if(found.includes(i))return;const d=Math.hypot(c[0]-x,c[1]-y);if(d<bd){bd=d;b=i}});
if(b>=0&&bd<=ODD[b][2]+14){found.push(b);ring(ODD[b]);hud();if(found.length==N)end('클리어! 이상한 물건 '+N+'개를 모두 찾았어요')}
else{lives--;const m=document.createElement('div');m.className='x';m.textContent='\u2715';m.style.left=x+'px';m.style.top=y+'px';m.style.transform='scale('+(1/s)+')';w.appendChild(m);setTimeout(()=>m.remove(),700);hud();if(lives<=0)end('하트를 모두 잃었어요. 처음부터 다시!')}}
const P=new Map();let last=null,moved=0,sx,sy;
v.addEventListener('pointerdown',e=>{if(e.target.tagName=='BUTTON')return;v.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==1){moved=0;sx=e.clientX;sy=e.clientY}else moved=99;last=null});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size==1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));clamp()}
else if(P.size==2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(last){const ns=s*d/last.d;const wx=(last.mx-tx)/s,wy=(last.my-ty)/s;s=ns;clamp();tx=mx-wx*s;ty=my-wy*s;clamp()}last={d,mx,my}}});
function up(e){const was=P.size;P.delete(e.pointerId);if(was==1&&moved<10&&e.type=='pointerup')tap(e.clientX,e.clientY);last=null}
v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
v.addEventListener('wheel',e=>{e.preventDefault();const wx=(e.clientX-tx)/s,wy=(e.clientY-ty)/s;s*=e.deltaY<0?1.15:1/1.15;clamp();tx=e.clientX-wx*s;ty=e.clientY-wy*s;clamp()},{passive:false});
addEventListener('resize',clamp);reset();
</script></body></html>
