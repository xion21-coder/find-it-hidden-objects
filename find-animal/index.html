<div id="hud"><span id="cnt">0/33</span><span id="hp"></span></div><div id="msg"><div id="mt"></div><button onclick="reset()">다시 하기</button></div>
<script>
const CATS=[[1416, 700, 43], [674, 895, 65], [881, 923, 38], [450, 795, 33], [526, 689, 28], [1567, 727, 35], [1256, 562, 26], [1203, 885, 36], [630, 588, 33], [632, 797, 40], [1299, 967, 40], [769, 512, 26], [1167, 804, 33], [1166, 621, 30], [1394, 602, 27], [299, 597, 35], [415, 714, 29], [1104, 506, 26], [931, 444, 27], [208, 884, 37], [1270, 478, 26], [229, 980, 40], [1669, 524, 26], [410, 620, 34], [1610, 620, 32], [660, 616, 28], [1760, 637, 35], [258, 675, 36], [440, 528, 28], [1590, 323, 26], [1700, 323, 26], [560, 263, 26], [1130, 295, 26]],RAB=[[1299, 596, 42], [855, 965, 57], [1553, 746, 65], [1396, 505, 40], [660, 948, 61], [937, 954, 55], [655, 837, 58]],N=CATS.length;let found,lives,s,tx,ty,over;
const v=document.getElementById('view'),w=document.getElementById('world');
function minS(){return Math.max(v.clientHeight/1008,v.clientWidth/1792)}
function clamp(){const m=minS();s=Math.min(Math.max(s,m),m*4);tx=Math.min(0,Math.max(v.clientWidth-1792*s,tx));ty=Math.min(0,Math.max(v.clientHeight-1008*s,ty));w.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
function hud(){document.getElementById('cnt').textContent=found.length+'/'+N;document.getElementById('hp').textContent='\u2764'.repeat(lives)+'\u2661'.repeat(3-lives)}
function reset(){found=[];lives=3;over=false;document.querySelectorAll('.mk,.x').forEach(e=>e.remove());document.getElementById('msg').style.display='none';s=minS();tx=0;ty=0;clamp();hud()}
function end(t){over=true;document.getElementById('mt').textContent=t;document.getElementById('msg').style.display='flex'}
function tap(cx,cy){if(over)return;const x=(cx-tx)/s,y=(cy-ty)/s;let b=-1,bd=1e9;CATS.forEach((c,i)=>{if(found.includes(i))return;const d=Math.hypot(c[0]-x,c[1]-y);if(d<bd){bd=d;b=i}});
if(b>=0&&bd<=CATS[b][2]&&!RAB.some(r=>Math.hypot(r[0]-x,r[1]-y)<Math.hypot(CATS[b][0]-x,CATS[b][1]-y)&&Math.hypot(r[0]-x,r[1]-y)<r[2])){found.push(b);const m=document.createElement('div');m.className='mk';m.style.left=CATS[b][0]+'px';m.style.top=CATS[b][1]+'px';w.appendChild(m);hud();if(found.length==N)end('클리어! 고양이 '+N+'마리를 모두 찾았어요')}
else{lives--;if(lives<=0){}const m=document.createElement('div');m.className='x';m.textContent='\u2715';m.style.left=x+'px';m.style.top=y+'px';m.style.transform='scale('+(1/s)+')';w.appendChild(m);setTimeout(()=>m.remove(),700);hud();if(lives<=0)end('하트를 모두 잃었어요. 처음부터 다시!')}}
const P=new Map();let last=null,moved=0,sx,sy;
v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==1){moved=0;sx=e.clientX;sy=e.clientY}else moved=99;last=null});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size==1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));clamp()}
else if(P.size==2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(last){const ns=s*d/last.d;const wx=(last.mx-tx)/s,wy=(last.my-ty)/s;s=ns;clamp();tx=mx-wx*s;ty=my-wy*s;clamp()}last={d,mx,my}}});
function up(e){const was=P.size;P.delete(e.pointerId);if(was==1&&moved<10&&e.type=='pointerup')tap(e.clientX,e.clientY);last=null}
v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
v.addEventListener('wheel',e=>{e.preventDefault();const wx=(e.clientX-tx)/s,wy=(e.clientY-ty)/s;s*=e.deltaY<0?1.15:1/1.15;clamp();tx=e.clientX-wx*s;ty=e.clientY-wy*s;clamp()},{passive:false});
addEventListener('resize',clamp);reset();
</script></body></html>
